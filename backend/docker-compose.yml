services:
  api:
    build:
      context: .
    command: uvicorn app.services.auth_service:app --host 0.0.0.0 --port 8000
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      WS_REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TASK_QUEUE_ENABLED: "true"
      WORKER_LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --queues=pipeline,chat,default --concurrency=1
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_WORKER_POOL: prefork
      TASK_QUEUE_ENABLED: "true"
      WORKER_LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
